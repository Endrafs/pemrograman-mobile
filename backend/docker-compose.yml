version: '3.8'

services:
  # Service Aplikasi PHP/Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - backend_net

  # Service Web Server Nginx
  web:
    image: nginx:alpine
    container_name: backend_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend_net

  # Service Database MySQL (Sesuai panduan tutorial)
  db_flutter:
    image: mysql:8.0
    container_name: db_flutter
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: data_flutter
      MYSQL_ROOT_PASSWORD: roid12345
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  db_data:
